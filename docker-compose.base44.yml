name: cgpa-tracker

services:
  api:
    image: node:22-slim
    working_dir: /app/server
    # Deps live in a named volume mounted over the bind-mounted source, so they are
    # installed on startup from the repo's own manifests/lockfile.
    command:
      - sh
      - -ec
      - npm install --no-audit --no-fund && exec npm run dev
    volumes:
      - ./:/app
      - api_node_modules:/app/server/node_modules
      - api_data:/app/server/data
    environment:
      PORT: "8000"
      DATA_DIR: /app/server/data
      NODE_ENV: development
      BASE44_PREVIEW_MODE:
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8000/api/state').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 60s
    restart: on-failure
    labels:
      base44.project: CGPA Tracker API
      base44.kind: api
      base44.port: "8000"

  web:
    image: node:22-slim
    working_dir: /app/web
    command:
      - sh
      - -ec
      - npm install --no-audit --no-fund && exec npm run dev
    volumes:
      - ./:/app
      - web_node_modules:/app/web/node_modules
    environment:
      NODE_ENV: development
      API_URL: http://api:8000
      # Platform-provided; Vite >= 6.1 appends it to server.allowedHosts.
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:
      BASE44_PREVIEW_MODE:
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 60s
    restart: on-failure
    labels:
      base44.project: CGPA Tracker
      base44.kind: web
      base44.port: "3000"

volumes:
  api_node_modules:
  web_node_modules:
  api_data:
